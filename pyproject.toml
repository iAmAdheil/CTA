[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-harness"
version = "0.1.0"
description = "Agentic engineering harness — orchestrator/worker control-loop wrappers."
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0"]

[tool.setuptools]
packages = ["harness"]
