$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "task.schema.yaml"
title: Task
description: >
  A single unit of work executed by a worker agent. Task files live in a
  feature-scoped workspace: tasks/<feature>/{backlog,in-progress,review,done}/,
  where <feature> is the implementing spec's frontmatter id. The orchestrator
  moves the file between the four state subdirs of its feature workspace; the
  grandparent directory of any task file is its feature.
type: object
additionalProperties: false

required:
  - id
  - title
  - spec
  - feature
  - status
  - priority
  - depends_on
  - blocks
  - can_parallelize_with
  - model
  - qa_failure_count

properties:
  id:
    type: string
    pattern: "^(TASK|BUG)-[0-9]+$"
    description: Unique task ID. BUG-NNN is reserved for orchestrator-filed out-of-scope findings from QA.

  title:
    type: string
    minLength: 1

  spec:
    type: string
    description: Path (from project root) to the spec this task implements.

  feature:
    type: string
    minLength: 1
    description: >
      The feature-workspace slug this task belongs to — the implementing spec's
      frontmatter id (e.g. "feature-data-export"). Authored by task-breakdown.
      This is the <feature> segment of the task's path
      (tasks/<feature>/<state>/<id>.yaml) and the docs/04-active-features/<feature>/
      dir. Redundant with the path on purpose: it keeps the task file
      self-describing for board updates and reconcile even if read in isolation.

  status:
    type: string
    enum:
      - backlog
      - in-progress
      - pr-opened
      - pr-updated
      - qa-failed
      - qa-passed
      - done
      - blocked
      - blocked-escalated
    description: >
      Lifecycle state. The QA retry loop (issue #4): pr-opened triggers QA;
      qa-failed = needs-changes (Opus fixer pushes to the branch -> pr-updated ->
      re-QA); qa-passed = looks-good, awaiting the human's manual merge;
      blocked-escalated = escalate (fundamental mismatch or QA run failed N times).

  priority:
    type: string
    enum: [critical, high, medium, low]

  depends_on:
    type: array
    items: { type: string, pattern: "^(TASK|BUG)-[0-9]+$" }

  blocks:
    type: array
    items: { type: string, pattern: "^(TASK|BUG)-[0-9]+$" }

  can_parallelize_with:
    type: array
    items: { type: string, pattern: "^(TASK|BUG)-[0-9]+$" }

  assigned_to:
    type: [string, "null"]
    description: Worker identifier, filled in by orchestrator when spawned.

  model:
    type: string
    enum: [sonnet, opus, haiku]

  expected_behavior:
    type: array
    items: { type: string }
    description: >
      The QA rubric — observable, implementation-agnostic acceptance behaviour
      authored by task-breakdown from the spec, BEFORE code exists ("given X,
      observable outcome Y"). The grading truth QA judges against. Vocabulary
      tracks the task layer (backend = API/data contract, frontend = UI
      behaviour, E2E = journey). Worker builds to it; QA tests against it.

  branch:
    type: [string, "null"]
    description: >
      The git branch for this task's PR (task/<id>). Empty/null at creation;
      the worker fills it when it opens the PR. Empty-vs-filled is the worker's
      fix-mode signal: a fresh task (empty) creates the branch + gh pr create;
      a qa-failed task (filled) means fix mode — push to this branch, no new PR.

  pr_base:
    type: [string, "null"]
    description: >
      The branch this task's PR targets, written by the orchestrator at spawn
      time (the worker passes it to `gh pr create --base`). Null/empty means the
      repo default branch (back-compat). Under the feature-branch model it is the
      per-spec integration branch `feature/<spec-id>`: every task in a spec is
      cut from that branch and PRs back into it. When QA passes, the orchestrator
      merges the task's PR into feature/<spec-id> (setting the task `done`); the
      feature branch therefore accumulates all completed work, so a dependent —
      cut from feature/<spec-id> once its parents are `done` — already has their
      code. The human's only merge is feature/<spec-id> -> default, once the spec
      is green. The agent merges into the feature branch but never into default.

  qa_instructions:
    type: [string, "null"]
    description: >
      Path to the worker-authored QA recipe (qa-instructions-<id>.md): how to
      drive THIS feature (routes/payloads for backend, navigate + interactions
      for frontend) plus the worker's claimed I/O. A map for QA, never the rubric.

  qa_report:
    type: [string, "null"]
    description: Path to the QA agent's report (qa-report-<id>.md). Its status field is the durable verdict signal.

  failure_reason:
    type: [string, "null"]
    description: >
      Written by the orchestrator when a task escalates/blocks (escalate verdict,
      or QA run failed N times) so the human sees why in-file without digging.

  qa_run_attempts:
    type: integer
    minimum: 0
    description: >
      Infra-retry counter for a QA run that died without a verdict (review file
      stuck at WIP). Orchestrator increments on each dead run; at N (=2) it
      escalates. Distinct from the verdict retry ladder (qa_failure_count).

  linear_id:
    type: [string, "null"]

  worktree:
    type: [string, "null"]
    description: Path to the git worktree the worker is using.

  pane:
    type: [string, "null"]
    description: tmux pane id (e.g. "%7") assigned to this task's agent in the shared agents window.

  started:
    type: [string, "null"]
    format: date-time

  pr_url:
    type: [string, "null"]
    format: uri

  pr_number:
    type: [integer, "null"]

  qa_failure_count:
    type: integer
    minimum: 0
    description: >
      Verdict-ladder pass counter (the ladder is ONE retry, not 3 strikes).
      0 = first QA pass; 1 = re-QA after one Opus fix. On the 2nd pass anything
      but looks-good escalates — there is no count >= 2 in normal operation.

  qa_verify_injected:
    type: boolean
    description: >
      TEST SCAFFOLD ONLY (HARNESS_QA_VERIFY). Set true by the orchestrator once it
      has injected a deliberate behavioral bug into this task's branch (step 4S), so
      the injection happens exactly once and survives a crash/replay. Never set in
      normal operation — the hook is for verifying that real behavioral QA catches
      defects and the Opus fix loop heals them. See the orchestrator skill, step 4S.

  qa_out_of_scope_bugs:
    type: array
    items: { type: string, pattern: "^BUG-[0-9]+$" }
    description: >
      Reserved and currently UNUSED. Out-of-scope bugs QA notices are ignored by
      the retry loop; the future random-bugs subsystem owns them.

  suggested_files_to_read:
    type: array
    items: { type: string }
    description: Files in the codebase the worker should read before writing code.

  references:
    type: array
    items: { type: string }
    description: Misc files (wireframes, mockups, flows) the worker reads alongside the spec.
