$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "orchestrator-state.schema.yaml"
title: OrchestratorState
description: Live orchestrator state. Ephemeral, never committed. Written atomically each cycle.
type: object
additionalProperties: false

required:
  - active_workers
  - max_workers
  - queue

properties:
  active_workers:
    type: array
    items:
      type: object
      additionalProperties: false
      required: [task_id, worktree, pane, started, model]
      properties:
        task_id:
          type: string
          pattern: "^(TASK|BUG)-[0-9]+$"
        worktree:
          type: string
          description: >-
            Path (absolute or relative to project root) of the git worktree.
            One worktree per TASK (../wt-<id>), not per agent: the worker creates
            it and QA/fixer/re-QA entries reuse the same path. It persists across
            role handoffs and is removed only when the task leaves its active
            states; so several active_workers entries over a task's life share
            one worktree value.
        pane:
          type: string
          pattern: "^%[0-9]+$"
          description: tmux pane id (e.g. "%7") of the agent's pane in the shared agents window.
        started:
          type: string
          format: date-time
        model:
          type: string
          enum: [sonnet, opus, haiku]
        role:
          type: string
          enum: [worker, qa, fixer]
          description: Tracked-agent kind acting on the task (worker | qa | fixer).

  max_workers:
    type: integer
    minimum: 1
    description: Cap on concurrent worker agents.

  queue:
    type: array
    description: Task IDs that are runnable (deps satisfied) but waiting for a worker slot.
    items:
      type: string
      pattern: "^(TASK|BUG)-[0-9]+$"

  last_action:
    type: [string, "null"]

  last_action_time:
    type: [string, "null"]
    format: date-time

  cycle_count:
    type: integer
    minimum: 0
